# /etc/netplan/50-cloud-init.yaml on the Ubuntu Server gateway
# enp0s1 = WAN (UTM "Shared Network", DHCP from the Mac host)
# enp0s2 = LAN (isolated lab subnet, static; default gateway for every client VM)
# Apply with: sudo chmod 600 /etc/netplan/*.yaml && sudo netplan apply
network:
  version: 2
  ethernets:
    enp0s1:
      dhcp4: true
    enp0s2:
      dhcp4: false
      addresses:
        - 172.16.50.1/24
